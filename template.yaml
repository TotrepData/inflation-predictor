AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  PoC Inflation Predictor — Pipeline Lambda cloud-native
  MINE4105 · Soluciones de Datos en la Nube · Uniandes

# ─── Parámetros ───────────────────────────────────────────────────────────────
Parameters:
  FredApiKey:
    Type: String
    NoEcho: true
    Description: API Key de FRED (gratuita en fred.stlouisfed.org)
  S3Bucket:
    Type: String
    Default: poc-inflation-predictor
    Description: Bucket S3 donde se almacenan los datos del pipeline

# ─── Configuración compartida entre las 3 funciones ──────────────────────────
Globals:
  Function:
    Runtime: python3.11
    Timeout: 300
    MemorySize: 512
    # Layer AWSSDKPandas incluye pandas, numpy y pyarrow sin empaquetar en el zip
    Layers:
      - !Sub arn:aws:lambda:${AWS::Region}:336392948345:layer:AWSSDKPandas-Python311:20
    Environment:
      Variables:
        S3_BUCKET: !Ref S3Bucket

# ─── Recursos ─────────────────────────────────────────────────────────────────
Resources:

  # Rol IAM compartido por las 3 Lambdas
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: poc-inflation-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # Lambda 1 — Collector
  # Descarga las 11 series de FRED API y las guarda como CSV en S3 bronze/
  CollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: fn-poc-collector
      Handler: handler.handler
      CodeUri: lambdas/collector/
      Role: !GetAtt LambdaRole.Arn
      Description: Descarga 11 series FRED → S3 bronze/*.csv
      Environment:
        Variables:
          FRED_API_KEY: !Ref FredApiKey

  # Lambda 2 — ETL
  # Lee bronze/*.csv, hace merge + limpieza, guarda silver/dataset_modelo.parquet
  EtlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: fn-poc-etl
      Handler: handler.handler
      CodeUri: lambdas/etl/
      Role: !GetAtt LambdaRole.Arn
      Description: Merge + limpieza bronze → silver/dataset_modelo.parquet

  # Lambda 3 — Features
  # Lee silver/dataset_modelo.parquet, ejecuta feature engineering, guarda gold/features.parquet
  FeaturesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: fn-poc-features
      Handler: handler.handler
      CodeUri: lambdas/features/
      Role: !GetAtt LambdaRole.Arn
      Description: Feature engineering silver → gold/features.parquet

# ─── Outputs ──────────────────────────────────────────────────────────────────
Outputs:
  CollectorFunction:
    Description: ARN de fn-poc-collector
    Value: !GetAtt CollectorFunction.Arn
  EtlFunction:
    Description: ARN de fn-poc-etl
    Value: !GetAtt EtlFunction.Arn
  FeaturesFunction:
    Description: ARN de fn-poc-features
    Value: !GetAtt FeaturesFunction.Arn
